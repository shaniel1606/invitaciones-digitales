<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Años de Amor - Eka de Ventura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="checkbox" id="detonar" class="trigger-checkbox">

    <div class="escena-principal">
        
        <!-- Pantalla Inicial: Bomba de Corazón -->
        <label for="detonar" class="contenedor-bomba" aria-label="Toca el corazón para abrir la invitación">
            <div class="resplandor-fondo"></div>
            
            <div class="bomba-wrapper">
                <!-- Fragmentos para efecto de desintegración en CSS puro -->
                <div class="fragmento frag-1"></div>
                <div class="fragmento frag-2"></div>
                <div class="fragmento frag-3"></div>
                <div class="fragmento frag-4"></div>
                <div class="fragmento frag-5"></div>
                <div class="fragmento frag-6"></div>
                <div class="fragmento frag-7"></div>
                <div class="fragmento frag-8"></div>
                <div class="fragmento frag-9"></div>

                <!-- Ilustración vectorial de alta precisión basada en la referencia -->
                <svg class="svg-bomba" viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="gradCorazon" cx="35%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ff5c8a"/>
                            <stop offset="45%" stop-color="#d90429"/>
                            <stop offset="85%" stop-color="#800f2f"/>
                            <stop offset="100%" stop-color="#4a0417"/>
                        </radialGradient>
                        <linearGradient id="brilloSuperior" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
                            <stop offset="50%" stop-color="#ffccd5" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </linearGradient>
                        <linearGradient id="gradMecha" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#3d2314"/>
                            <stop offset="50%" stop-color="#7f4f24"/>
                            <stop offset="100%" stop-color="#2b170c"/>
                        </linearGradient>
                        <filter id="sombraBomba" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#2b0510" flood-opacity="0.55"/>
                        </filter>
                    </defs>

                    <!-- Sombra base en el suelo -->
                    <ellipse cx="205" cy="422" rx="95" ry="14" fill="rgba(0,0,0,0.35)" class="sombra-suelo"/>

                    <!-- Mecha trenzada -->
                    <path d="M 192 162 C 175 110, 245 115, 255 62" fill="none" stroke="url(#gradMecha)" stroke-width="11" stroke-linecap="round"/>
                    <path d="M 192 162 C 175 110, 245 115, 255 62" fill="none" stroke="#a67c52" stroke-width="11" stroke-dasharray="4 7" stroke-linecap="round" opacity="0.7"/>

                    <!-- Boquilla del corazón -->
                    <path d="M 178 168 L 184 152 C 190 148, 202 151, 205 157 L 201 174 Z" fill="#9e0031" stroke="#590d22" stroke-width="2"/>

                    <!-- Cuerpo del corazón -->
                    <g filter="url(#sombraBomba)">
                        <path d="M 195 175 
                                 C 155 115, 55 125, 45 215 
                                 C 35 305, 135 375, 212 415 
                                 C 285 365, 375 280, 355 190 
                                 C 338 110, 240 112, 195 175 Z" 
                              fill="url(#gradCorazon)" stroke="#ff758f" stroke-width="3"/>
                        
                        <!-- Reflejo de cristal superior izquierdo -->
                        <path d="M 178 178 
                                 C 145 132, 72 140, 62 212 
                                 C 58 242, 72 268, 95 285 
                                 C 115 240, 150 215, 192 205 Z" 
                              fill="url(#brilloSuperior)"/>

                        <!-- Reflejo de cristal superior derecho -->
                        <path d="M 212 175 
                                 C 245 128, 322 130, 338 195 
                                 C 344 222, 335 250, 318 270 
                                 C 295 225, 258 202, 208 198 Z" 
                              fill="url(#brilloSuperior)" opacity="0.8"/>
                    </g>

                    <!-- Chispa explosiva en la punta de la mecha -->
                    <g class="chispa-animada" transform="translate(255, 58)">
                        <polygon points="0,-36 9,-12 34,-18 16,2 32,24 7,15 -4,38 -11,13 -36,16 -16,-3 -28,-26 -6,-13" fill="#ff4d00"/>
                        <polygon points="0,-24 6,-8 22,-12 10,1 21,16 5,10 -3,25 -7,8 -24,10 -10,-2 -18,-17 -4,-8" fill="#ffbe0b"/>
                        <polygon points="0,-13 3,-4 12,-6 5,1 11,8 3,5 -2,13 -4,4 -13,5 -5,-1 -10,-9 -2,-4" fill="#ffffff"/>
                        <!-- Estrellitas alrededor -->
                        <polygon points="-32,-28 -30,-23 -25,-22 -30,-20 -32,-15 -34,-20 -39,-22 -34,-23" fill="#ffbe0b"/>
                        <polygon points="35,-25 37,-20 42,-19 37,-17 35,-12 33,-17 28,-19 33,-20" fill="#ff4d00"/>
                        <polygon points="36,18 38,23 43,24 38,26 36,31 34,26 29,24 34,23" fill="#ffbe0b"/>
                        <polygon points="-28,22 -26,27 -21,28 -26,30 -28,35 -30,30 -35,28 -30,27" fill="#ff4d00"/>
                    </g>
                </svg>
            </div>

            <div class="indicacion-tocar">
                <span>Toca nuestro corazón</span>
                <small>8 años de historia están por estallar</small>
            </div>
        </label>

        <!-- Onda expansiva y partículas al detonar -->
        <div class="onda-expansiva"></div>
        <div class="destello-blanco"></div>
        <div class="explosion-particulas">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <!-- Lluvia continua de Corazones y Tulipanes flotantes -->
        <div class="capa-elementos-flotantes" aria-hidden="true">
            <!-- Corazones -->
            <div class="item-flotante corazon c1">❤</div>
            <div class="item-flotante corazon c2">♥</div>
            <div class="item-flotante corazon c3">❤</div>
            <div class="item-flotante corazon c4">♥</div>
            <div class="item-flotante corazon c5">❤</div>
            <div class="item-flotante corazon c6">♥</div>
            <div class="item-flotante corazon c7">❤</div>
            <div class="item-flotante corazon c8">♥</div>

            <!-- Tulipanes SVG -->
            <div class="item-flot
